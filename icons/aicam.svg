<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The HUD panel's own palette: near-black, cyan, a red recording dot. -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#0d1a22"/>
      <stop offset="1" stop-color="#05080c"/>
    </radialGradient>
    <radialGradient id="glass" cx=".38" cy=".34" r=".8">
      <stop offset="0" stop-color="#3ef0ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#0f4a52" stop-opacity=".6"/>
      <stop offset="1" stop-color="#05080c"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#3ef0ff" opacity=".06"/>
    </pattern>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#scan)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="23.5" fill="none" stroke="#0f4a52"/>

  <!-- corner brackets, as in the panel's header -->
  <g fill="none" stroke="#3ef0ff" stroke-width="4" stroke-linecap="square" filter="url(#glow)">
    <path d="M18 34V18h16"/>
    <path d="M94 18h16v16"/>
    <path d="M18 94v16h16"/>
    <path d="M110 94v16H94"/>
  </g>

  <!-- the lens: dashed outer ring like the fps gauge, glass inside -->
  <g filter="url(#glow)">
    <circle cx="64" cy="64" r="33" fill="none" stroke="#0f4a52" stroke-width="6"/>
    <circle cx="64" cy="64" r="33" fill="none" stroke="#3ef0ff" stroke-width="6"
            stroke-dasharray="155 52" transform="rotate(-90 64 64)"/>
  </g>
  <circle cx="64" cy="64" r="24" fill="url(#glass)" stroke="#3ef0ff" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="9" fill="#05080c" stroke="#3ef0ff" stroke-width="2"/>
  <circle cx="56" cy="55" r="4" fill="#e6fbff" opacity=".7"/>

  <!-- live -->
  <circle cx="100" cy="28" r="6" fill="#ff3b4e" filter="url(#glow)"/>
</svg>
